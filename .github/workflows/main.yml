name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Configurer Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurer .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Installer la charge Android
      run: dotnet workload install android

    - name: Restaurer les dépendances
      run: dotnet restore

    - name: Compiler le fichier APK Android
      run: dotnet publish -f net8.0-android31.0 -c Release -p:AndroidPackageFormat=apk

    - name: Sauvegarder l'APK généré
      uses: actions/upload-artifact@v4
      with:
        name: Application-Android-APK
        path: '**/*.apk'
