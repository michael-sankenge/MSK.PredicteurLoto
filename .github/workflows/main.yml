name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      MSBUILDDISABLENETSDKEOLERRORS: "true"

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Bloquer le SDK 10 et forcer .NET 8
      run: |
        echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json

    - name: Configurer Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurer .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        global-json-file: global.json

    - name: Installer la charge Android
      run: dotnet workload install android

    - name: Préparer le projet, le Manifest et corriger le code C#
      run: |
        python3 -c "
        import glob, os

        manifest = '''<?xml version=\"1.0\" encoding=\"utf-8\"?>
        <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"com.msk.predicteurloto\">
            <uses-sdk android:minSdkVersion=\"21\" android:targetSdkVersion=\"34\" />
            <application android:allowBackup=\"true\" android:label=\"MSK PredicteurLoto\" android:supportsRtl=\"true\">
            </application>
        </manifest>'''

        # 1. Correction de App.axaml.cs (résolution de l'ambiguïté Application)
        for f in glob.glob('**/App.axaml.cs', recursive=True):
            if 'bin' in f or 'obj' in f: continue
            with open(f, 'r', encoding='utf-8') as file:
                c = file.read()
            if 'using Application = Avalonia.Application;' not in c:
                c = 'using Application = Avalonia.Application;\n' + c
                with open(f, 'w', encoding='utf-8') as file:
                    file.write(c)

        # 2. Correction de ViewLocator.cs (compatibilité Avalonia 11)
        for f in glob.glob('**/ViewLocator.cs', recursive=True):
            if 'bin' in f or 'obj' in f: continue
            with open(f, 'r', encoding='utf-8') as file:
                c = file.read()
            c = c.replace('IControl', 'Control?')
            c = c.replace('Control??', 'Control?')
            c = c.replace('Build(object data)', 'Build(object? data)')
            c = c.replace('Build(object param)', 'Build(object? param)')
            c = c.replace('Match(object data)', 'Match(object? data)')
            c = c.replace('Match(object param)', 'Match(object? param)')
            with open(f, 'w', encoding='utf-8') as file:
                file.write(c)

        # 3. Création du Manifest et mise à jour du .csproj
        for file in glob.glob('**/*.csproj', recursive=True):
            if 'bin' in file or 'obj' in file: continue
            proj_dir = os.path.dirname(file)
            
            with open(os.path.join(proj_dir, 'AndroidManifest.xml'), 'w', encoding='utf-8') as f:
                f.write(manifest)
            
            props_dir = os.path.join(proj_dir, 'Properties')
            os.makedirs(props_dir, exist_ok=True)
            with open(os.path.join(props_dir, 'AndroidManifest.xml'), 'w', encoding='utf-8') as f:
                f.write(manifest)

            content = '''<Project Sdk=\"Microsoft.NET.Sdk\">
          <PropertyGroup>
            <TargetFramework>net8.0-android34.0</TargetFramework>
            <SupportedOSPlatformVersion>21.0</SupportedOSPlatformVersion>
            <OutputType>Exe</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <CheckEolTargetFramework>false</CheckEolTargetFramework>
            <SuppressNETSDK1202>true</SuppressNETSDK1202>
            <AndroidManifest>AndroidManifest.xml</AndroidManifest>
          </PropertyGroup>

          <ItemGroup>
            <PackageReference Include=\"Avalonia\" Version=\"11.1.3\" />
            <PackageReference Include=\"Avalonia.Android\" Version=\"11.1.3\" />
            <PackageReference Include=\"Avalonia.Controls.DataGrid\" Version=\"11.1.3\" />
            <PackageReference Include=\"Avalonia.Desktop\" Version=\"11.1.3\" />
            <PackageReference Include=\"Avalonia.ReactiveUI\" Version=\"11.1.3\" />
            <PackageReference Include=\"Avalonia.Fonts.Inter\" Version=\"11.1.3\" />
          </ItemGroup>
        </Project>'''
            with open(file, 'w', encoding='utf-8') as f:
                f.write(content)
        "

    - name: Compiler l'APK
      run: |
        CSPROJ=$(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*" | head -n 1)
        dotnet publish "$CSPROJ" -c Release -p:AndroidPackageFormat=apk -p:CheckEolTargetFramework=false -p:SuppressNETSDK1202=true

    - name: Sauvegarder l'APK généré
      uses: actions/upload-artifact@v4
      with:
        name: Application-Android-APK
        path: '**/*.apk'
