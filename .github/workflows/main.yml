name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Configurer Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurer .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Installer la charge Android
      run: dotnet workload install android

    - name: Corriger le fichier projet et compiler
      run: |
        CSPROJ_FILE=$(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*" | head -n 1)
        echo "Modification automatique de : $CSPROJ_FILE"

        cat << 'EOF' > "$CSPROJ_FILE"
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFrameworks>net8.0;net8.0-android31.0</TargetFrameworks>
            <OutputType>Exe</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <SupportedOSPlatformVersion>21.0</SupportedOSPlatformVersion>
            <TargetPlatformVersion>31.0</TargetPlatformVersion>
          </PropertyGroup>

          <ItemGroup>
            <PackageReference Include="Avalonia" Version="11.0.10" />
            <PackageReference Include="Avalonia.Controls.DataGrid" Version="11.0.10" />
            <PackageReference Include="Avalonia.Desktop" Version="11.0.10" />
            <PackageReference Include="Avalonia.ReactiveUI" Version="11.0.10" />
            <PackageReference Include="Avalonia.Fonts.Inter" Version="11.0.10" />
          </ItemGroup>

          <ItemGroup Condition="'$(TargetFramework)' == 'net8.0-android31.0'">
            <PackageReference Include="Avalonia.Android" Version="11.0.10" />
          </ItemGroup>
        </Project>
        EOF

        dotnet publish "$CSPROJ_FILE" -f net8.0-android31.0 -c Release -p:AndroidPackageFormat=apk

    - name: Sauvegarder l'APK généré
      uses: actions/upload-artifact@v4
      with:
        name: Application-Android-APK
        path: '**/*.apk'
