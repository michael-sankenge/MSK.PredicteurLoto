name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      MSBUILDDISABLENETSDKEOLERRORS: "true"

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Forcer le SDK .NET 8
      run: echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json

    - name: Configurer Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurer .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        global-json-file: global.json

    - name: Installer la charge Android
      run: dotnet workload install android

    - name: Préparer le projet et appliquer tous les correctifs
      run: |
        cat << 'EOF' > fix_script.py
        import glob, os, re, shutil

        # 1. Détection de l'icône
        icon_path = None
        for f in glob.glob('**/icon.png', recursive=True):
            if 'bin' not in f and 'obj' not in f:
                icon_path = f
                break

        icon_manifest_attr = ' android:icon="@drawable/icon" android:roundIcon="@drawable/icon"' if icon_path else ''
        icon_activity_attr = '\n    Icon = "@drawable/icon",' if icon_path else ''

        manifest = f'''<?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.msk.predicteurloto">
            <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="34" />
            <application android:allowBackup="true" android:label="MSK PredicteurLoto" android:supportsRtl="true"{icon_manifest_attr}>
            </application>
        </manifest>'''

        main_activity_code = f'''using Android.App;
        using Android.Content.PM;
        using Avalonia;
        using Avalonia.Android;
        using Avalonia.ReactiveUI;

        namespace MSK.PredicteurLoto;

        [Activity(
            Label = "MSK PredicteurLoto",{icon_activity_attr}
            Theme = "@android:style/Theme.DeviceDefault.NoActionBar",
            MainLauncher = true,
            ConfigurationChanges = ConfigChanges.Orientation | ConfigChanges.ScreenSize | ConfigChanges.UiMode)]
        public class MainActivity : AvaloniaMainActivity<App>
        {{
            protected override AppBuilder CustomizeAppBuilder(AppBuilder builder)
            {{
                return base.CustomizeAppBuilder(builder)
                    .WithInterFont()
                    .UseReactiveUI();
            }}
        }}
        '''

        # 2. Correction App.axaml pour s'assurer que les thèmes Fluent et DataGrid sont inclus
        for f in glob.glob('**/App.axaml', recursive=True):
            if 'bin' in f or 'obj' in f: continue
            with open(f, 'r', encoding='utf-8') as file: c = file.read()
            c = re.sub(r'Mode="[^"]*"', '', c)
            if 'avares://Avalonia.Controls.DataGrid/Themes/Fluent.xaml' not in c:
                c = c.replace('</Application.Styles>', '    <StyleInclude Source="avares://Avalonia.Controls.DataGrid/Themes/Fluent.xaml"/>\n</Application.Styles>')
            with open(f, 'w', encoding='utf-8') as file: file.write(c)

        # 3. Conversion Window -> UserControl dans les fichiers AXAML
        for f in glob.glob('**/*.axaml', recursive=True):
            if 'bin' in f or 'obj' in f or 'App.axaml' in f: continue
            with open(f, 'r', encoding='utf-8') as file: c = file.read()
            if '<Window' in c:
                c = re.sub(r'<Window\b', '<UserControl', c)
                c = re.sub(r'</Window>', '</UserControl>', c)
                window_attrs = ['Title', 'WindowStartupLocation', 'CanResize', 'ExtendClientAreaToDecorationsHint', 
                               'ExtendClientAreaChromeHints', 'ExtendClientAreaTitleBarHeightHint', 'SystemDecorations', 'WindowState', 'Icon']
                for attr in window_attrs:
                    c = re.sub(rf'\s+{attr}="[^"]*"', '', c)
                with open(f, 'w', encoding='utf-8') as file: file.write(c)

        # 4. Corrections du code C# (.cs)
        for f in glob.glob('**/*.cs', recursive=True):
            if 'bin' in f or 'obj' in f or f.endswith('App.axaml.cs'): continue
            with open(f, 'r', encoding='utf-8') as file: c = file.read()
            modified = False

            if ': Window' in c or ':Avalonia.Controls.Window' in c:
                c = c.replace(': Window', ': UserControl').replace(':Avalonia.Controls.Window', ': Avalonia.Controls.UserControl')
                if 'using Avalonia.Controls;' not in c:
                    c = 'using Avalonia.Controls;\n' + c
                modified = True

            if '.Items' in c:
                c = re.sub(r'\.Items\b', '.ItemsSource', c)
                c = c.replace('.ItemsSourceSource', '.ItemsSource')
                modified = True

            if 'ShowAsync(' in c:
                c = re.sub(r'ShowAsync\s*\(\s*this\s*\)', 'ShowAsync(null!)', c)
                modified = True

            if modified:
                with open(f, 'w', encoding='utf-8') as file: file.write(c)

        # 5. App.axaml.cs avec capture d'écran d'erreur intégrée
        app_cs_code = '''using Avalonia;
        using Avalonia.Controls;
        using Avalonia.Controls.ApplicationLifetimes;
        using Avalonia.Markup.Xaml;
        using System;
        using System.Linq;

        namespace MSK.PredicteurLoto;

        public partial class App : Avalonia.Application
        {
            public override void Initialize()
            {
                AvaloniaXamlLoader.Load(this);
            }

            public override void OnFrameworkInitializationCompleted()
            {
                try
                {
                    var mainViewType = AppDomain.CurrentDomain.GetAssemblies()
                        .SelectMany(a => a.GetTypes())
                        .FirstOrDefault(t => (t.Name == "MainWindow" || t.Name == "MainView") && typeof(Control).IsAssignableFrom(t));

                    Control? view = null;
                    if (mainViewType != null)
                    {
                        view = (Control)Activator.CreateInstance(mainViewType)!;
                    }

                    if (view == null)
                    {
                        view = new TextBlock { Text = "Vue principale introuvable.", Margin = new Thickness(20) };
                    }

                    if (ApplicationLifetime is ISingleViewApplicationLifetime singleView)
                    {
                        singleView.MainView = view;
                    }
                    else if (ApplicationLifetime is IClassicDesktopStyleApplicationLifetime desktop)
                    {
                        desktop.MainWindow = new Window { Content = view };
                    }
                }
                catch (Exception ex)
                {
                    var errorView = new ScrollViewer
                    {
                        Content = new TextBlock
                        {
                            Text = "Erreur au démarrage :\n\n" + ex.ToString(),
                            Foreground = Avalonia.Media.Brushes.Red,
                            Margin = new Thickness(20),
                            TextWrapping = Avalonia.Media.TextWrapping.Wrap
                        }
                    };

                    if (ApplicationLifetime is ISingleViewApplicationLifetime singleView)
                    {
                        singleView.MainView = errorView;
                    }
                    else if (ApplicationLifetime is IClassicDesktopStyleApplicationLifetime desktop)
                    {
                        desktop.MainWindow = new Window { Content = errorView };
                    }
                }

                base.OnFrameworkInitializationCompleted();
            }
        }
        '''

        for f in glob.glob('**/App.axaml.cs', recursive=True):
            if 'bin' in f or 'obj' in f: continue
            with open(f, 'w', encoding='utf-8') as file:
                file.write(app_cs_code)

        # 6. ViewLocator
        for f in glob.glob('**/ViewLocator.cs', recursive=True):
            if 'bin' in f or 'obj' in f: continue
            with open(f, 'r', encoding='utf-8') as file: c = file.read()
            c = c.replace('IControl', 'Control?').replace('Control??', 'Control?')
            c = c.replace('Build(object data)', 'Build(object? data)').replace('Match(object data)', 'Match(object? data)')
            with open(f, 'w', encoding='utf-8') as file: file.write(c)

        # 7. Configuration .csproj
        for file in glob.glob('**/*.csproj', recursive=True):
            if 'bin' in file or 'obj' in file: continue
            proj_dir = os.path.dirname(file)
            
            if icon_path:
                drawable_dir = os.path.join(proj_dir, 'Resources', 'drawable')
                os.makedirs(drawable_dir, exist_ok=True)
                target_icon = os.path.join(drawable_dir, 'icon.png')
                if os.path.abspath(icon_path) != os.path.abspath(target_icon):
                    shutil.copy(icon_path, target_icon)

            with open(os.path.join(proj_dir, 'AndroidManifest.xml'), 'w', encoding='utf-8') as f:
                f.write(manifest)
            
            props_dir = os.path.join(proj_dir, 'Properties')
            os.makedirs(props_dir, exist_ok=True)
            with open(os.path.join(props_dir, 'AndroidManifest.xml'), 'w', encoding='utf-8') as f:
                f.write(manifest)

            with open(os.path.join(proj_dir, 'MainActivity.cs'), 'w', encoding='utf-8') as f:
                f.write(main_activity_code)

            content = '''<Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0-android34.0</TargetFramework>
            <SupportedOSPlatformVersion>21.0</SupportedOSPlatformVersion>
            <OutputType>Exe</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <CheckEolTargetFramework>false</CheckEolTargetFramework>
            <SuppressNETSDK1202>true</SuppressNETSDK1202>
            <PublishTrimmed>false</PublishTrimmed>
            <RunAOTCompilation>false</RunAOTCompilation>
            <AndroidManifest>AndroidManifest.xml</AndroidManifest>
          </PropertyGroup>

          <ItemGroup>
            <PackageReference Include="Avalonia" Version="11.1.3" />
            <PackageReference Include="Avalonia.Android" Version="11.1.3" />
            <PackageReference Include="Avalonia.Themes.Fluent" Version="11.1.3" />
            <PackageReference Include="Avalonia.Controls.DataGrid" Version="11.1.3" />
            <PackageReference Include="Avalonia.Desktop" Version="11.1.3" />
            <PackageReference Include="Avalonia.ReactiveUI" Version="11.1.3" />
            <PackageReference Include="Avalonia.Fonts.Inter" Version="11.1.3" />
          </ItemGroup>
        </Project>'''
            with open(file, 'w', encoding='utf-8') as f: f.write(content)
        EOF
        python3 fix_script.py

    - name: Compiler l'APK
      run: |
        CSPROJ=$(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*" | head -n 1)
        dotnet publish "$CSPROJ" -c Release -p:AndroidPackageFormat=apk -p:CheckEolTargetFramework=false -p:SuppressNETSDK1202=true -p:PublishTrimmed=false -p:RunAOTCompilation=false

    - name: Sauvegarder l'APK généré
      uses: actions/upload-artifact@v4
      with:
        name: Application-Android-APK
        path: '**/*.apk'
